name: Build Charlie APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: charlie-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Charlie Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake autopoint gettext libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev rustc cargo

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.6.0' 'cython==3.0.12'

      - name: Preflight checks
        run: |
          python --version
          java -version
          buildozer --version
          python -m py_compile main.py
          test -f buildozer.spec

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
        run: |
          buildozer -v android debug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not produced."
            find bin -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Charlie APK
        uses: actions/upload-artifact@v7
        with:
          name: Charlie-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
